[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhydropannes"
version = "0.1.1"
description = "Async client for Hydro-QuÃ©bec's Info-pannes outage service"
readme = "README.md"
license = "MIT"
authors = [{ name = "johnjohn-11" }]
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9", "tzdata; sys_platform == 'win32'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/johnjohn-11/pyhydropannes"
Issues = "https://github.com/johnjohn-11/pyhydropannes/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyhydropannes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
packages = ["pyhydropannes"]
mypy_path = "src"
